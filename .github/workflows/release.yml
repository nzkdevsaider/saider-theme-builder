name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package the plugin ready to import
        run: |
          mkdir -p release/saider-theme-builder
          cp -r manifest.json dist release/saider-theme-builder/
          cd release && zip -r "saider-theme-builder-${GITHUB_REF_NAME}.zip" saider-theme-builder
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
