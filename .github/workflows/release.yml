name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Package the plugin ready to import
        run: |
          mkdir -p release/saider-theme-builder
          cp -r manifest.json dist release/saider-theme-builder/
          cd release && zip -r "saider-theme-builder-${GITHUB_REF_NAME}.zip" saider-theme-builder
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
